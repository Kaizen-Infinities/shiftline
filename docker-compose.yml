# Local stack. `docker compose up -d postgres` is the light path (api and web run
# on the host with `make dev`); `docker compose --profile full up --build` (or `make up`)
# runs everything with the development values in docker/api.env: the api container
# applies migrations and seeds the demo tenant before it starts serving.
name: shiftline

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shiftline
      POSTGRES_PASSWORD: shiftline
      POSTGRES_DB: shiftline
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shiftline -d shiftline"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    # Migrations and the (idempotent) demo seed run first, so a fresh clone boots to a login page.
    command: >
      sh -c "npm run -w @shiftline/shared build
      && npx -w @shiftline/api prisma migrate deploy
      && npm run -w @shiftline/api db:seed
      && npm run dev --workspace @shiftline/api"
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://shiftline_migrator:shiftline_migrator@postgres:5432/shiftline
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:5000
      EMBED_WORKER: "false"
      EXPORT_DIR: /app/exports
    env_file:
      - docker/api.env
      - path: apps/api/.env
        required: false
    ports:
      - "5000:5000"
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      # Only the sources: the built packages/shared/dist stays in the image (it is
      # gitignored on the host, so mounting ./packages would hide it).
      - ./packages/shared/src:/app/packages/shared/src
      - ./exports:/app/exports
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:5000/ready'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: npm run worker --workspace @shiftline/api
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://shiftline_migrator:shiftline_migrator@postgres:5432/shiftline
      ARCHIVE_DIR: /app/archives
      BACKUP_DIR: /app/backups
      EXPORT_DIR: /app/exports
    env_file:
      - docker/api.env
      - path: apps/api/.env
        required: false
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./apps/api/prisma:/app/apps/api/prisma
      # Only the sources: the built packages/shared/dist stays in the image (it is
      # gitignored on the host, so mounting ./packages would hide it).
      - ./packages/shared/src:/app/packages/shared/src
      - ./archives:/app/archives
      - ./backups:/app/backups
      - ./exports:/app/exports
    # Waits for the api's /ready (migrations applied, seed done) so pg-boss and the job
    # handlers never see a half-initialised database.
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: npm run dev --workspace @shiftline/web -- --host 0.0.0.0
    environment:
      VITE_API_URL: http://localhost:5000/api
    ports:
      - "5173:5173"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/index.html:/app/apps/web/index.html
      # Only the sources: the built packages/shared/dist stays in the image (it is
      # gitignored on the host, so mounting ./packages would hide it).
      - ./packages/shared/src:/app/packages/shared/src
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
