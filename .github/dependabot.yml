version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          ["eslint*", "typescript*", "prettier", "vitest*", "@vitest/*", "husky", "lint-staged"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: "/apps/api"
    schedule:
      interval: weekly
